name: iOS build (unsigned)

# Manual only: macOS runners are slower and use more Actions minutes.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate platform folders if missing
        run: |
          if [ ! -d ios ]; then
            flutter create . --project-name bizpos --org com.bizpos --platforms ios
          fi
          python3 tool/patch_platforms.py

      - run: flutter pub get

      - name: Build iOS (no code signing)
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app
        run: |
          cd build/ios/iphoneos
          zip -qr ../../../BizPOS-ios-unsigned.zip Runner.app

      - uses: actions/upload-artifact@v4
        with:
          name: BizPOS-ios-unsigned-${{ github.run_number }}
          path: BizPOS-ios-unsigned.zip
