name: bizpos
description: Offline-first point of sale and business management app for small businesses.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State
  provider: ^6.1.2

  # Local database
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2

  # Utilities
  uuid: ^4.5.1
  intl: ^0.19.0
  crypto: ^3.0.5
  http: ^1.2.2

  # UI
  fl_chart: ^0.69.0

  # Invoices and printing
  pdf: ^3.11.1
  printing: ^5.13.2
  esc_pos_utils_plus: ^2.0.4
  print_bluetooth_thermal: ^1.1.0
  permission_handler: ^11.3.1

  # Camera, images, files
  mobile_scanner: ^6.0.2
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  share_plus: ^10.0.2

  # Licensing, 2FA, QR
  cryptography: ^2.7.0
  qr_flutter: ^4.1.0

  # Paid features: voice, alerts, reminders
  speech_to_text: 7.0.0 # 7.1+ needs a newer Flutter Gradle plugin
  flutter_local_notifications: ^17.2.4
  local_auth: ^2.3.0
  image: ^4.2.0
  url_launcher: ^6.3.0

  # Accounts and online subscriptions
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Cloud backup
  google_sign_in: ^6.2.1
  googleapis: ^13.2.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.12
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.3.3
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Inter (SIL OFL 1.1), subset to Latin. Urdu text falls back to the system font.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
