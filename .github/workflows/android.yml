name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders (first run only)
        run: |
          set -o pipefail
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create . --project-name bizpos --org com.bizpos --platforms android,ios 2>&1 | tee -a ci.log
          fi
          python3 tool/patch_platforms.py 2>&1 | tee -a ci.log

      - name: Install packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a ci.log

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Unit tests
        run: |
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.jks
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Using release keystore from secrets." | tee -a ci.log
          else
            echo "No KEYSTORE_BASE64 secret: APK is signed with a temporary debug key." | tee -a ci.log
          fi

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release 2>&1 | tee -a ci.log
          cp build/app/outputs/flutter-apk/app-release.apk BizPOS-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BizPOS-apk-${{ github.run_number }}
          path: BizPOS-${{ github.run_number }}.apk

      - name: Commit generated platform folders
        if: github.event_name == 'push'
        run: |
          rm -f android/key.properties android/app/release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata || true
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Android and iOS platform folders"
            git push
          fi

      - name: Publish CI log
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp ci.log /tmp/cilog/latest.log 2>/dev/null || echo "no log" > /tmp/cilog/latest.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/cilog/status.txt
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@local commit -qm "CI log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
