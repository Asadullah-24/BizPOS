name: Android build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.24.5'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate platform folders (first run only)
        run: |
          set -o pipefail
          if [ ! -d android ] || [ ! -d ios ]; then
            flutter create . --project-name bizpos --org com.bizpos --platforms android,ios 2>&1 | tee -a ci.log
          fi
          python3 tool/patch_platforms.py 2>&1 | tee -a ci.log

      - name: Install packages
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee -a ci.log

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci.log

      - name: Unit tests
        run: |
          sudo apt-get install -y -qq libsqlite3-dev > /dev/null
          set -o pipefail
          flutter test 2>&1 | tee -a ci.log

      - name: Release signing key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            # Tolerate spaces/line breaks introduced when pasting the secret.
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \r\n\t' | base64 -d > android/app/release.jks
            # Store and key passwords are the same unless KEY_PASSWORD is set.
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            KEY_ALIAS="${KEY_ALIAS:-bizpos}"
            keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null \
              && echo "Release keystore verified." | tee -a ci.log \
              || { echo "ERROR: release keystore or KEYSTORE_PASSWORD is wrong." | tee -a ci.log; exit 1; }
            {
              echo "storeFile=release.jks"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/key.properties
            echo "Using release keystore from secrets." | tee -a ci.log
          else
            echo "No KEYSTORE_BASE64 secret: APK is signed with a temporary debug key." | tee -a ci.log
          fi

      - name: Build APKs (one per CPU, smaller) and Play Store bundle
        run: |
          set -o pipefail
          OPTS="--release --obfuscate --split-debug-info=build/symbols"
          # Maven Central sometimes fails for a moment; retry once.
          flutter build apk $OPTS --split-per-abi 2>&1 | tee -a ci.log || (sleep 30 && flutter build apk $OPTS --split-per-abi 2>&1 | tee -a ci.log)
          flutter build appbundle $OPTS 2>&1 | tee -a ci.log
          OUT=build/app/outputs
          cp $OUT/flutter-apk/app-arm64-v8a-release.apk BizPOS.apk
          cp $OUT/flutter-apk/app-armeabi-v7a-release.apk BizPOS-armv7.apk
          cp $OUT/bundle/release/app-release.aab BizPOS.aab
          ls -la BizPOS*.apk BizPOS.aab | tee -a ci.log

      - uses: actions/upload-artifact@v4
        with:
          name: BizPOS-${{ github.run_number }}
          path: |
            BizPOS.apk
            BizPOS-armv7.apk
            BizPOS.aab

      # Direct phone-friendly link: https://github.com/<owner>/<repo>/releases/latest/download/BizPOS.apk
      - name: Publish to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BizPOS.apk BizPOS-armv7.apk BizPOS.aab \
            --target "${{ github.sha }}" \
            --title "BizPOS build ${{ github.run_number }}" \
            --notes "BizPOS.apk: most phones (64-bit). BizPOS-armv7.apk: older 32-bit phones. BizPOS.aab: upload to Google Play." \
            --latest

      - name: Commit generated platform folders
        if: github.event_name == 'push'
        run: |
          rm -f android/key.properties android/app/release.jks
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android ios .metadata || true
          if ! git diff --cached --quiet; then
            git commit -m "Add generated Android and iOS platform folders"
            git push
          fi

      - name: Publish CI log
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp ci.log /tmp/cilog/latest.log 2>/dev/null || echo "no log" > /tmp/cilog/latest.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/cilog/status.txt
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-logs
          git add .
          git -c user.name=ci -c user.email=ci@local commit -qm "CI log for run ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs
