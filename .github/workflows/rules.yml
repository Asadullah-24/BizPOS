name: Firestore rules

on:
  push:
    branches: [main]
    paths: ['firebase/**', 'firebase.json', '.github/workflows/rules.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install
        working-directory: firebase
        run: npm install --no-audit --no-fund
      - name: Rules tests (Firestore emulator)
        working-directory: firebase
        run: |
          set -o pipefail
          npm test 2>&1 | tee ../rules.log
      - name: Publish log
        if: always()
        run: |
          mkdir -p /tmp/cilog
          cp rules.log /tmp/cilog/latest.log 2>/dev/null || echo "no log" > /tmp/cilog/latest.log
          echo "run=${{ github.run_number }} sha=${{ github.sha }} status=${{ job.status }}" > /tmp/cilog/status.txt
          cd /tmp/cilog
          git init -q
          git checkout -q -b ci-logs-rules
          git add .
          git -c user.name=ci -c user.email=ci@local commit -qm "rules log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" ci-logs-rules
